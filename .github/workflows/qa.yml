name: Activity QA
on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_evidence:
        description: Run focused native release checks and capture store screenshots
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  activities:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.release_evidence }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Verify committed Pages build
        run: |
          npm run build
          git ls-files --error-unmatch index.html sw.js
          git diff --exit-code -- index.html sw.js
          node scripts/sync-ios.mjs
          git diff --exit-code -- ios/DoodleFun/Resources/index.html ios/DoodleFun/Resources/BundleManifest.json
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: activity-qa-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  iphone-build:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.release_evidence }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the offline iPhone app
        run: >-
          xcodebuild -project ios/DoodleFun.xcodeproj -scheme DoodleFun
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/DoodleFun-build"
          CODE_SIGNING_ALLOWED=NO build
      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/doodle-simulators.json"
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import path from 'node:path';
          const inventory = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, 'doodle-simulators.json'), 'utf8'));
          const candidates = Object.entries(inventory.devices ?? {})
            .filter(([runtime]) => runtime.includes('.iOS-'))
            .flatMap(([, devices]) => devices)
            .filter(device => device.isAvailable && /^iPhone(?:\s|$)/.test(device.name));
          const selected = candidates.find(device => device.name === 'iPhone 17 Pro') ?? candidates[0];
          if (!selected || !/^[0-9A-F-]{36}$/i.test(selected.udid)) throw new Error('No available iPhone simulator was found on this runner.');
          appendFileSync(process.env.GITHUB_OUTPUT, `udid=${selected.udid}\n`);
          console.log(`Native QA simulator: ${selected.name} (${selected.udid})`);
          NODE
      - name: Run native gameplay and landscape regressions
        env:
          DOODLE_SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: >-
          npm run test:iphone -- --device "$DOODLE_SIMULATOR_UDID"
          --output "$RUNNER_TEMP/DoodleFun-native-qa" --only DoodleFunTests
      - name: Run trusted native listening interactions
        timeout-minutes: 10
        shell: bash
        env:
          DOODLE_SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          caffeinate -di npm run test:iphone -- --device "$DOODLE_SIMULATOR_UDID" \
            --output "$RUNNER_TEMP/DoodleFun-native-audio-qa" --without-gameplay \
            --only DoodleFunUITests/ActivityCatalogUITests/testTrustedSoundDetectiveRequiresAudioAndRespectsItsOwnMute \
            --only DoodleFunUITests/ActivityCatalogUITests/testTrustedPitchPathCanRetryAndChooseTheHeardContour \
            --only DoodleFunUITests/ActivityCatalogUITests/testTrustedMelodyEchoPlaysPadsInOrderAfterRetry \
            --only DoodleFunUITests/ActivityCatalogUITests/testTrustedBeatStudioRecoversFromBackgroundAndChecksRealTaps \
            2>&1 | tee "$RUNNER_TEMP/DoodleFun-native-audio-qa.log"
      - name: Keep native failure evidence
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: iphone-native-qa-report
          path: |
            ${{ runner.temp }}/DoodleFun-native-qa/*.xcresult/**
            ${{ runner.temp }}/DoodleFun-native-qa/qa-build.json
            ${{ runner.temp }}/DoodleFun-native-qa/run-*.json
            ${{ runner.temp }}/DoodleFun-native-qa/last-command.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep native listening evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iphone-native-audio-qa-report
          path: |
            ${{ runner.temp }}/DoodleFun-native-audio-qa/*.xcresult/**
            ${{ runner.temp }}/DoodleFun-native-audio-qa/qa-build.json
            ${{ runner.temp }}/DoodleFun-native-audio-qa/run-*.json
            ${{ runner.temp }}/DoodleFun-native-audio-qa/last-command.json
            ${{ runner.temp }}/DoodleFun-native-audio-qa.log
          if-no-files-found: ignore
          retention-days: 7

  release-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_evidence }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run serial native release checks and real store captures
        env:
          DOODLE_RELEASE_OUTPUT: ${{ runner.temp }}/DoodleFun-release-evidence
        run: node scripts/release-evidence.mjs --output "$DOODLE_RELEASE_OUTPUT"
      - name: Keep release evidence and original screenshot bytes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/DoodleFun-release-evidence/release-evidence.json
            ${{ runner.temp }}/DoodleFun-release-evidence/inventory.json
            ${{ runner.temp }}/DoodleFun-release-evidence/*/*.json
            ${{ runner.temp }}/DoodleFun-release-evidence/*/*.log
            ${{ runner.temp }}/DoodleFun-release-evidence/*/*.xcresult/**
            ${{ runner.temp }}/DoodleFun-release-evidence/store-*/attachments-*/*.png
            ${{ runner.temp }}/DoodleFun-release-evidence/store-*/attachments-*/manifest.json
            ${{ runner.temp }}/DoodleFun-release-evidence/screenshots/**
          if-no-files-found: error
          retention-days: 14
