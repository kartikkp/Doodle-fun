name: Activity QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  activities:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: activity-qa-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
